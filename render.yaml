## 〔 ✦ 〕 Deploy

<div align="center">

### ☁️ One-Click Deploy

[![Deploy on Render](https://img.shields.io/badge/Deploy_on-Render-46E3B7?style=for-the-badge&logo=render&logoColor=white&labelColor=0D1117)](https://render.com)
[![Deploy on Railway](https://img.shields.io/badge/Deploy_on-Railway-7C3AED?style=for-the-badge&logo=railway&logoColor=white&labelColor=0D1117)](https://railway.app)

</div>

<br>

<details>
<summary><b>🖥 Render — Step by Step</b></summary>

<br>

**1.** Fork this repository

**2.** Go to [render.com](https://render.com) → **New Web Service**

**3.** Connect your GitHub and select this repo

**4.** Set build & start commands:

```bash
# Build Command
pip install -U -r requirements.txt

# Start Command
bash start
```

**5.** Add all environment variables from the table above

**6.** Hit **Deploy** 🚀

</details>

<details>
<summary><b>🚂 Railway — Step by Step</b></summary>

<br>

**1.** Fork this repository

**2.** Create a new project at [railway.app](https://railway.app)

**3.** Connect your GitHub repo

**4.** Add environment variables

**5.** Deploy 🚀

</details>

<details>
<summary><b>🖥 VPS / Self-Host</b></summary>

<br>

```bash
# Update system
apt update && apt upgrade -y

# Install dependencies
apt install python3 python3-pip ffmpeg git -y

# Clone repo



# Install requirements
pip3 install -U -r requirements.txt

# Configure variables
cp .env.example .env
nano .env

# Run the bot
bash start
# or
python -m Music420bot
```

</details>

<details>
<summary><b>🐳 Docker</b></summary>

<br>

```bash
# Build the image
docker build -t music420bot .

# Run the container (pass your .env file)
docker run -d --env-file .env --name music420bot music420bot
```

</details>

<br>

## 〔 ✦ 〕 Commands

<table>
<tr>
<td width="33%">

**🎵 Music**
```
/play    — Play audio
/vplay   — Play video
/cplay   — Channel play
/pause   — Pause stream
/resume  — Resume stream
/skip    — Skip track
/end     — End stream
/queue   — View queue
/loop    — Loop mode
/shuffle — Shuffle queue
```

</td>
<td width="33%">

**🛡 Admin**
```
/reload   — Refresh admins
/auth     — Authorize user
/unauth   — Remove auth
/authlist — View auth list
/seek     — Seek stream
/seekback — Seek backward
/mute     — Mute assistant
/unmute   — Unmute assistant
/volume   — Set volume
/stop     — Stop playback
```

</td>
<td width="33%">

**👑 Sudo / Owner**
```
/addsudo     — Add sudo user
/delsudo     — Remove sudo
/sudolist    — List sudos
/broadcast   — Send broadcast
/gban        — Global ban
/ungban      — Global unban
/maintenance — Toggle mode
/stats       — Bot statistics
/restart     — Restart bot
/logs        — View logs
```

</td>
</tr>
</table>

